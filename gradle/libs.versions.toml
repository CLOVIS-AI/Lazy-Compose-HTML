# List of dependencies of the project

[versions]
compose-multiplatform = "1.12.2"      # https://github.com/JetBrains/compose-multiplatform/releases

kotlin-browser = "1.0.0-pre.758"      # https://github.com/JetBrains/kotlin-wrappers?tab=readme-ov-file#kotlin-wrappers

[plugins]

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-html = { module = "org.jetbrains.compose.html:html-core", version.ref = "compose-multiplatform" }

kotlin-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlin-browser" }

[bundles]
